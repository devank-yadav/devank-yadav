name: Render board

on:
  schedule:
    # Hourly. GitHub runs scheduled jobs on a best-effort basis, so treat this
    # as "about hourly" rather than on the minute.
    - cron: '17 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

# Only one render at a time; a queued run would just redo the same work.
concurrency:
  group: board
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore last render state
        # The last known view count lives on the board branch, next to the SVGs.
        run: |
          git fetch --depth=1 origin board 2>/dev/null \
            && git show origin/board:board-state.json > assets/board-state.json \
            || echo "no previous state"

      - name: Render the board
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_LOGIN: ${{ github.repository_owner }}
        run: node scripts/render-board.mjs

      - name: Render the stack panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_LOGIN: ${{ github.repository_owner }}
        run: node scripts/render-stack.mjs

      - name: Publish to the board branch
        # The board lives on its own branch as a single commit that each render
        # replaces, so main's history only ever holds real changes.
        run: |
          cp assets/board-*.svg assets/stack-*.svg assets/board-state.json "$RUNNER_TEMP/"
          git checkout --orphan render
          git rm -rfq --cached .
          git clean -fdxq
          cp "$RUNNER_TEMP"/board-*.svg "$RUNNER_TEMP"/stack-*.svg "$RUNNER_TEMP"/board-state.json .
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add board-*.svg stack-*.svg board-state.json
          git commit -qm "Render board"
          git push -qf origin render:board
