name: Render board

on:
  schedule:
    # Hourly. GitHub runs scheduled jobs on a best-effort basis, so treat this
    # as "about hourly" rather than on the minute.
    - cron: '17 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

# Only one render at a time; a queued run would just redo the same work.
concurrency:
  group: board
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Render the board
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_LOGIN: ${{ github.repository_owner }}
          # The one hand-written line on the board. Edit it here.
          NOW_SHIPPING: 'glanceOS v9.7 — alerts, teams, multi-page boards'
        run: node scripts/render-board.mjs

      - name: Bust the camo cache
        # GitHub proxies README images through camo and caches them by URL, so a
        # changed file alone will not always show. Bumping ?v= in the README
        # gives the new render a URL camo has not seen.
        run: |
          stamp=$(date -u +%Y%m%d%H)
          sed -i -E "s/(board-(light|dark)\.svg)\?v=[0-9]+/\1?v=$stamp/g" README.md

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- assets README.md; then
            echo "board unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git commit -m "Update board"
          # A push to main can land while this runs. Rebase onto it and retry
          # rather than failing the render.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((attempt * 5))
          done
          exit 1
